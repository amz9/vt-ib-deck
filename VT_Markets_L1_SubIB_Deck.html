<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VT Markets Sub-IB Partnership</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    :root {
      --navy: #0A1F44;
      --navy-light: #1A3B7C;
      --navy-dark: #050F26;
      --crimson: #C8102E;
      --crimson-dark: #8B0000;
      --gold: #D4AF37;
      --gold-light: #E8C75A;
      --white: #FFFFFF;
      --off-white: #F8F6F1;
      --gray: #6B7280;
      --gray-light: #E5E7EB;
      --black: #000000;
      --theme-intro: #EBF3FB;
      --theme-intro-accent: #C7DEF5;
      --theme-intro-border: #5B9BD5;
      --theme-main: #FBF0F2;
      --theme-main-accent: #F5C7CE;
      --theme-main-border: #C8102E;
      --theme-vision: #FDF9EC;
      --theme-vision-accent: #F5E8A3;
      --theme-vision-border: #D4AF37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Inter', 'Arial', sans-serif;
      background: var(--navy-dark);
      color: var(--navy);
      overflow: hidden;
      height: 100vh;
    }

    #root { width: 100vw; height: 100vh; }

    .slide-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .slide {
      flex: 1;
      padding: 32px 56px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--white);
      position: relative;
    }

    .slide-header {
      border-bottom: 3px solid var(--gold);
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .slide-title { font-size: 32px; font-weight: 700; color: var(--navy); letter-spacing: -0.5px; }
    .slide-subtitle { font-size: 14px; color: var(--gray); font-weight: 500; text-transform: uppercase; letter-spacing: 2px; }
    .slide-number { font-size: 13px; color: var(--gray); font-weight: 500; }

    .nav-bar {
      background: var(--navy-dark);
      color: var(--white);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid var(--gold);
    }

    .nav-btn {
      background: transparent;
      color: var(--white);
      border: 1px solid var(--gold);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      font-family: inherit;
    }
    .nav-btn:hover { background: var(--gold); color: var(--navy-dark); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-btn.primary { background: var(--crimson); border-color: var(--crimson); }
    .nav-btn.primary:hover { background: var(--crimson-dark); border-color: var(--gold); color: var(--white); }

    .progress-dots { display: flex; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: all 0.2s; }
    .dot.active { background: var(--gold); transform: scale(1.3); }
    .dot:hover { background: var(--gold-light); }

    .brand { font-weight: 700; color: var(--gold); letter-spacing: 1px; font-size: 14px; }
    .brand-sub { color: rgba(255,255,255,0.6); font-size: 11px; margin-left: 8px; }

    .btn-print {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.7);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .btn-print:hover { color: var(--gold); }

    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th { background: var(--navy); color: var(--white); padding: 10px 8px; text-align: center; font-weight: 600; border: 1px solid var(--navy-light); }
    td { padding: 8px; text-align: center; border: 1px solid var(--gray-light); }
    tr:nth-child(even) td { background: var(--off-white); }
    td.bold { font-weight: 700; color: var(--navy); }
    td.earner { background: var(--crimson) !important; color: var(--white); font-weight: 700; }
    td.row-label { background: var(--navy-light); color: var(--white); font-weight: 600; text-align: left; padding-left: 14px; }
    td.total { background: var(--gold); color: var(--navy-dark); font-weight: 700; }

    .amount { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }

    .card { background: var(--off-white); border-left: 4px solid var(--crimson); padding: 16px 20px; border-radius: 4px; }
    .card.gold { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(212,175,55,0.08), transparent); }
    .card.navy { border-left-color: var(--navy); }
    .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gray); font-weight: 600; margin-bottom: 4px; }
    .card-value { font-size: 24px; font-weight: 700; color: var(--navy); }
    .card-note { font-size: 12px; color: var(--gray); margin-top: 4px; }

    .bullet { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .bullet-icon { width: 24px; height: 24px; background: var(--gold); color: var(--navy-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; margin-top: 2px; }
    .bullet-text { font-size: 14px; line-height: 1.6; color: var(--navy); }
    .bullet-text strong { color: var(--crimson); }

    .chain-node { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 6px; margin-bottom: 6px; }
    .chain-node.you { background: var(--crimson); color: var(--white); }
    .chain-node.sub { background: var(--off-white); border: 1px solid var(--gray-light); }
    .chain-node.client { background: var(--navy); color: var(--white); border: 2px solid var(--gold); }
    .chain-arrow { text-align: center; color: var(--gold); font-size: 18px; margin: 2px 0; }
    .chain-label { font-weight: 700; font-size: 14px; min-width: 80px; }
    .chain-desc { font-size: 12px; opacity: 0.9; }

    input[type="range"] { width: 100%; accent-color: var(--crimson); }
    select, input[type="number"] { width: 100%; padding: 6px 10px; border: 1px solid var(--gray-light); border-radius: 4px; font-size: 13px; font-family: inherit; }
    select:focus, input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }

    .input-label { font-size: 12px; font-weight: 600; color: var(--navy); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .input-label .value { color: var(--crimson); font-weight: 700; }

    .title-slide {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
      color: var(--white);
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0;
    }
    .title-main { font-size: 64px; font-weight: 800; letter-spacing: -2px; margin-bottom: 16px; }
    .title-accent { color: var(--gold); }
    .title-tag { font-size: 22px; color: rgba(255,255,255,0.85); font-weight: 300; margin-bottom: 8px; }
    .title-detail { font-size: 14px; color: var(--gold); letter-spacing: 4px; text-transform: uppercase; margin-top: 32px; }
    .title-divider { width: 80px; height: 3px; background: var(--gold); margin: 20px auto; }

    .close-slide { background: linear-gradient(135deg, var(--crimson-dark) 0%, var(--navy-dark) 100%); color: var(--white); }
    .close-slide .slide-title { color: var(--white); }
    .close-slide .slide-header { border-bottom-color: var(--gold); }

    /* ── INTRODUCTION THEME (pages 2-4): Cool Blue ── */
    .slide-intro { background: var(--theme-intro) !important; border-top: 5px solid var(--theme-intro-border); }
    .slide-intro .slide-header { border-bottom-color: var(--theme-intro-border); }
    .slide-intro .slide-title { color: #1A3B7C; }
    .slide-intro .slide-subtitle { color: var(--theme-intro-border); }
    .slide-intro .bullet-icon { background: var(--theme-intro-border); color: #fff; }
    .slide-intro::before { content: ''; position: absolute; top: 0; right: 0; width: 280px; height: 280px; background: radial-gradient(circle at top right, rgba(91,155,213,0.12), transparent 70%); pointer-events: none; }

    /* ── MAIN POINT THEME (pages 5-7): Warm Crimson Rose ── */
    .slide-main { background: var(--theme-main) !important; border-top: 5px solid var(--theme-main-border); }
    .slide-main .slide-header { border-bottom-color: var(--theme-main-border); }
    .slide-main .slide-title { color: #6B0018; }
    .slide-main .slide-subtitle { color: var(--theme-main-border); }
    .slide-main::before { content: ''; position: absolute; top: 0; right: 0; width: 280px; height: 280px; background: radial-gradient(circle at top right, rgba(200,16,46,0.08), transparent 70%); pointer-events: none; }

    /* ── FUTURE INCOME VISION THEME (pages 8-10): Golden Amber ── */
    .slide-vision { background: var(--theme-vision) !important; border-top: 5px solid var(--theme-vision-border); }
    .slide-vision .slide-header { border-bottom-color: var(--theme-vision-border); }
    .slide-vision .slide-title { color: #6B4A00; }
    .slide-vision .slide-subtitle { color: #A07818; }
    .slide-vision::before { content: ''; position: absolute; top: 0; right: 0; width: 280px; height: 280px; background: radial-gradient(circle at top right, rgba(212,175,55,0.15), transparent 70%); pointer-events: none; }

    .l1-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--crimson);
      color: var(--white);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .print-only { display: none; }

    @media print {
      @page { size: landscape; margin: 0; }
      html, body { overflow: visible; background: white; }
      .nav-bar { display: none; }
      .slide { page-break-after: always; height: 100vh; }
      .slide-container { display: block; height: auto; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // L1 VIEW — direct earning rates per side per lot
    const L1_DIRECT = { G6: 22, G5: 18, G4: 14, G3: 10, G2: 6, G1: 1 };

    // L1 sub-matrix: L1 is "You" (top). Sub-chain: L2, L3, L4 (max 4 levels deep from L1)
    // Derived from MIB matrix by shifting one level: L1 plays MIB role
    // G2, G3 capped at L3 (3 sub-levels: L2 deepest in L1's chain)
    const L1_MATRIX = {
      G6: {
        You:  { You: 22 },
        L2:   { You: 4,  L2: 18 },
        L3:   { You: 4,  L2: 3,  L3: 15 },
        L4:   { You: 4,  L2: 3,  L3: 2,  L4: 13 },
      },
      G5: {
        You:  { You: 18 },
        L2:   { You: 3,  L2: 15 },
        L3:   { You: 3,  L2: 2,  L3: 13 },
        L4:   { You: 3,  L2: 2,  L3: 2,  L4: 11 },
      },
      G4: {
        You:  { You: 14 },
        L2:   { You: 3,  L2: 11 },
        L3:   { You: 3,  L2: 2,  L3: 9 },
        L4:   { You: 3,  L2: 2,  L3: 2,  L4: 7 },
      },
      G3: {
        You:  { You: 10 },
        L2:   { You: 2,  L2: 8 },
        L3:   { You: 2,  L2: 2,  L3: 6 },
      },
      G2: {
        You:  { You: 6 },
        L2:   { You: 1,  L2: 5 },
        L3:   { You: 1,  L2: 1,  L3: 4 },
      },
    };

    // G1 special: L1 earns $1 when they introduce directly; $0 override when sub-IB introduces
    const G1_L1_RULE = (deepest) => deepest === 'You' ? { You: 1 } : { [deepest]: 1 };

    const LEVELS_STD = ['You', 'L2', 'L3', 'L4'];
    const LEVELS_LTD = ['You', 'L2', 'L3'];
    const LEVEL_ORDER = { You: 0, L2: 1, L3: 2, L4: 3 };

    const fmt = (n) => '$' + Math.round(n).toLocaleString('en-US');

    function SlideHeader({ title, subtitle, slideNum, total }) {
      return (
        <div className="slide-header">
          <div>
            <div className="slide-subtitle">{subtitle}</div>
            <div className="slide-title">{title}</div>
          </div>
          <div className="slide-number">{slideNum} / {total}</div>
        </div>
      );
    }

    // ── SLIDE 1: TITLE ──────────────────────────────────────────────────────────
    function TitleSlide() {
      return (
        <div className="slide title-slide">
          <div>
            <div style={{ fontSize: '14px', color: 'var(--gold)', letterSpacing: '6px', marginBottom: '24px', fontWeight: 600 }}>VT MARKETS</div>
            <div className="title-main">Sub-IB <span className="title-accent">Partnership</span></div>
            <div className="title-divider"></div>
            <div className="title-tag">Your network. Your chain. Your income.</div>
            <div className="title-tag" style={{ fontSize: '16px', marginTop: '8px', opacity: 0.7 }}>4-level commission · 6 group tiers · transparent payouts</div>
            <div style={{ marginTop: '20px', display: 'inline-flex', gap: '12px', justifyContent: 'center' }}>
              <span style={{ background: 'rgba(212,175,55,0.15)', border: '1px solid var(--gold)', color: 'var(--gold)', padding: '6px 16px', borderRadius: '20px', fontSize: '12px', fontWeight: 600, letterSpacing: '2px' }}>L1 SUB-IB VIEW</span>
            </div>
            <div className="title-detail">Confidential · Partnership</div>
          </div>
        </div>
      );
    }

    // ── SLIDE 2: YOUR POSITION ──────────────────────────────────────────────────
    function PositionSlide({ slideNum, total }) {
      return (
        <div className="slide slide-intro">
          <SlideHeader title="Your position in the network" subtitle="Where you sit" slideNum={slideNum} total={total} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '40px', flex: 1, alignItems: 'center' }}>
            <div>
              <div className="l1-badge">● L1 Sub-IB</div>
              <h3 style={{ fontSize: '18px', color: '#1A3B7C', marginBottom: '20px', fontWeight: 700 }}>What being an L1 means for you</h3>
              <div className="bullet">
                <div className="bullet-icon">1</div>
                <div className="bullet-text"><strong>4 levels deep</strong> — you sit at the top of your own chain and can recruit sub-IBs up to 4 levels below you</div>
              </div>
              <div className="bullet">
                <div className="bullet-icon">2</div>
                <div className="bullet-text"><strong>Earn from every trade</strong> — every time a client in your chain trades, you receive a rebate — whether you introduced them or not</div>
              </div>
              <div className="bullet">
                <div className="bullet-icon">3</div>
                <div className="bullet-text"><strong>Up to $22/lot</strong> — direct clients on G6 pay you the highest rate. The more active your chain, the more you earn passively</div>
              </div>
              <div className="bullet">
                <div className="bullet-icon">4</div>
                <div className="bullet-text"><strong>Override income</strong> — when your sub-IBs recruit clients, you earn an override on every trade in their network automatically</div>
              </div>
              <div className="bullet">
                <div className="bullet-icon">5</div>
                <div className="bullet-text"><strong>No minute rules apply</strong> — payouts are straightforward, whole-dollar amounts, easy to explain to your own recruits</div>
              </div>
            </div>
            <div>
              <div style={{ background: 'var(--white)', borderRadius: '10px', padding: '24px', boxShadow: '0 2px 12px rgba(0,0,0,0.07)', border: '1px solid var(--theme-intro-accent)' }}>
                <div style={{ fontSize: '13px', color: 'var(--gray)', textTransform: 'uppercase', letterSpacing: '1.5px', fontWeight: 600, marginBottom: '16px' }}>Network structure</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  <div style={{ background: 'var(--crimson)', color: 'var(--white)', padding: '12px 16px', borderRadius: '8px', fontWeight: 700, fontSize: '14px' }}>
                    ★ You (L1) — Top of your chain
                  </div>
                  <div style={{ textAlign: 'center', color: 'var(--theme-intro-border)', fontSize: '16px' }}>↓ Override income flows up</div>
                  <div style={{ background: 'var(--off-white)', border: '1px solid var(--gray-light)', padding: '10px 16px', borderRadius: '8px', fontSize: '13px', color: 'var(--navy)' }}>
                    <strong>L2</strong> — Your direct sub-IBs
                  </div>
                  <div style={{ textAlign: 'center', color: 'var(--gray)', fontSize: '14px' }}>↓</div>
                  <div style={{ background: 'var(--off-white)', border: '1px solid var(--gray-light)', padding: '10px 16px', borderRadius: '8px', fontSize: '13px', color: 'var(--navy)' }}>
                    <strong>L3</strong> — Sub-IBs recruited by L2
                  </div>
                  <div style={{ textAlign: 'center', color: 'var(--gray)', fontSize: '14px' }}>↓</div>
                  <div style={{ background: 'var(--off-white)', border: '1px solid var(--gray-light)', padding: '10px 16px', borderRadius: '8px', fontSize: '13px', color: 'var(--navy)' }}>
                    <strong>L4</strong> — Deepest sub-IB level
                  </div>
                  <div style={{ textAlign: 'center', color: 'var(--gray)', fontSize: '14px' }}>↓</div>
                  <div style={{ background: 'var(--navy)', color: 'var(--white)', padding: '10px 16px', borderRadius: '8px', fontSize: '13px', border: '2px solid var(--gold)', fontWeight: 600 }}>
                    Clients — Active traders
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── SLIDE 3: CHAIN DIAGRAM ──────────────────────────────────────────────────
    function ChainSlide({ slideNum, total }) {
      return (
        <div className="slide slide-intro">
          <SlideHeader title="How your chain works" subtitle="4-level IB chain" slideNum={slideNum} total={total} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.2fr', gap: '40px', flex: 1 }}>
            <div>
              <h3 style={{ fontSize: '16px', color: '#1A3B7C', marginBottom: '12px', fontWeight: 700 }}>Your chain</h3>
              <div className="chain-node you">
                <div className="chain-label">You (L1)</div>
                <div className="chain-desc">Top of your network</div>
              </div>
              <div className="chain-arrow">↓</div>
              <div className="chain-node sub"><div className="chain-label">SUB-IB L2</div><div className="chain-desc">Your direct downline</div></div>
              <div className="chain-arrow">↓</div>
              <div className="chain-node sub"><div className="chain-label">SUB-IB L3</div><div className="chain-desc">Recruited by L2</div></div>
              <div className="chain-arrow">↓</div>
              <div className="chain-node sub"><div className="chain-label">SUB-IB L4</div><div className="chain-desc">Deepest level</div></div>
              <div className="chain-arrow">↓</div>
              <div className="chain-node client"><div className="chain-label">Clients</div><div className="chain-desc">Active traders</div></div>
            </div>
            <div>
              <h3 style={{ fontSize: '16px', color: '#1A3B7C', marginBottom: '12px', fontWeight: 700 }}>Example: L3 introduces a G4 client</h3>
              <p style={{ fontSize: '13px', color: 'var(--gray)', marginBottom: '16px' }}>When your L3 sub-IB brings in a client trading 1 lot on Group 4, earnings split like this:</p>
              <table>
                <thead><tr><th>Position</th><th>Role</th><th>$/lot</th></tr></thead>
                <tbody>
                  <tr><td className="bold" style={{ color: 'var(--crimson-dark)' }}>You (L1)</td><td style={{ color: 'var(--gray)' }}>Override — automatic</td><td className="bold amount">$3</td></tr>
                  <tr><td className="bold">L2</td><td style={{ color: 'var(--gray)' }}>Override</td><td className="bold amount">$2</td></tr>
                  <tr style={{ background: 'var(--crimson)' }}>
                    <td style={{ color: 'var(--white)', fontWeight: 700 }}>L3 (introducer)</td>
                    <td style={{ color: 'var(--white)' }}>Direct earner</td>
                    <td style={{ color: 'var(--white)', fontWeight: 700, fontSize: '15px' }} className="amount">$9</td>
                  </tr>
                  <tr><td className="bold">L4</td><td style={{ color: 'var(--gray)' }}>Not in chain</td><td className="amount" style={{ color: 'var(--gray)' }}>—</td></tr>
                </tbody>
              </table>
              <div className="card gold" style={{ marginTop: '16px' }}>
                <div className="card-title">Key principle</div>
                <div style={{ fontSize: '13px', color: 'var(--navy)', marginTop: '4px' }}>Rebate flows from client → introducer → every upline. Every level earns from every trade in their chain — including you, even if you never met that client.</div>
              </div>
              <div className="card navy" style={{ marginTop: '12px' }}>
                <div className="card-title">Your advantage</div>
                <div style={{ fontSize: '13px', color: 'var(--navy)', marginTop: '4px' }}>You earn override income on <strong style={{ color: 'var(--crimson-dark)' }}>all 4 levels</strong> below you. The more sub-IBs you recruit, the more passive income layers you build.</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── SLIDE 4: GROUP TIERS ────────────────────────────────────────────────────
    function TiersSlide({ slideNum, total }) {
      const groups = [
        { code: 'G6', type: 'Standard / Cent', fx: '3.2 pip', xau: '4.2 pip', rate: 22, levels: '4' },
        { code: 'G5', type: 'Standard / Cent', fx: '2.7 pip', xau: '3.7 pip', rate: 18, levels: '4' },
        { code: 'G4', type: 'Standard / Cent', fx: '2.2 pip', xau: '3.2 pip', rate: 14, levels: '4' },
        { code: 'G3', type: 'Standard / Cent', fx: '1.7 pip', xau: '2.7 pip', rate: 10, levels: '3' },
        { code: 'G2', type: 'Standard / Cent', fx: '1.2 pip', xau: '2.2 pip', rate: 6, levels: '3' },
        { code: 'G1', type: 'ECN', fx: '0.2 +6', xau: '1.2 +6', rate: 1, levels: '—' },
      ];
      return (
        <div className="slide slide-intro">
          <SlideHeader title="Group tiers at a glance" subtitle="All 6 groups" slideNum={slideNum} total={total} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
            <table style={{ fontSize: '14px' }}>
              <thead>
                <tr>
                  <th>Group</th>

    // ── SLIDE 8: CALCULATOR ─────────────────────────────────────────────────────

      const [group, setGroup] = useState('G4');

      const maxDeepest = useMemo(() => (group === 'G2' || group === 'G3') ? 2 : 3, [group]);
      const DEEPEST_OPTS = ['You', 'L2', 'L3', 'L4'];

      useEffect(() => {
        if (LEVEL_ORDER[deepest] > maxDeepest) {
          setDeepest(DEEPEST_OPTS[maxDeepest]);
        }
      }, [maxDeepest, deepest]);

      const calc = useMemo(() => {
        const lotSides = lots * traders * days * 2;
        const directRate = L1_DIRECT[group];
        const gr = growth / 100;
        let y2mult = 0;
        for (let m = 1; m <= 12; m++) y2mult += Math.pow(1 + gr, m);

        let dist;
        if (group === 'G1') {
          dist = G1_L1_RULE(deepest);
        } else {
          dist = L1_MATRIX[group][deepest] || { You: directRate };
        }

        const levels = DEEPEST_OPTS.map(lv => {
          const perSide = (dist && dist[lv]) ? dist[lv] : 0;
          const monthly = perSide * lotSides;
          const y1 = monthly * 12;
          const y2 = monthly * y2mult;
          return { lv, perSide, monthly, y1, y2, total2y: y1 + y2 };
        });
        const yourRow = levels.find(l => l.lv === 'You');
        return { lotSides, directRate, levels, yourRow, y2mult };

      const months = Array.from({ length: 24 }, (_, i) => i + 1);

      const data = months.map(m => {
        if (m <= 12) return { m, val: baseMonthly };

        return { m, val: baseMonthly * Math.pow(1 + growthRate, y2m) };
      });
      const maxVal = Math.max(...data.map(d => d.val));
      const cumulative = data.reduce((acc, d, i) => {
        acc.push((i === 0 ? 0 : acc[i - 1]) + d.val);

                    <g key={i}>
                      <line x1="40" y1={240 - p * 200} x2="580" y2={240 - p * 200} stroke="#E5E7EB" strokeWidth="0.5" strokeDasharray="2 2" />
                      <text x="36" y={240 - p * 200 + 4} fontSize="9" fill="#6B7280" textAnchor="end">${Math.round(maxVal * p / 1000)}K</text>
                    </g>
                  ))}
                  {data.map((d, i) => {
                    const x = 50 + i * 22;
                    const h = (d.val / maxVal) * 200;
                    const y = 240 - h;
                    return <rect key={i} x={x} y={y} width="18" height={h} fill={i < 12 ? 'url(#bar-y1)' : 'url(#bar-y2)'} />;
                  })}
                  <text x="160" y="265" fontSize="11" fill="#0A1F44" fontWeight="600" textAnchor="middle">Year 1 (flat baseline)</text>
                  <text x="430" y="265" fontSize="11" fill="#8B0000" fontWeight="600" textAnchor="middle">Year 2 (15% monthly growth)</text>
                  <line x1="305" y1="40" x2="305" y2="245" stroke="#C8102E" strokeWidth="1" strokeDasharray="4 4" />
                </svg>
              </div>
              <p style={{ fontSize: '11px', color: 'var(--gray)', textAlign: 'center', fontStyle: 'italic' }}>Illustrative chart: $4,200/mo baseline (L1 with growing L2 network), 15% monthly compound growth from M13.</p>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '14px', justifyContent: 'center' }}>
              <div className="card navy">
                <div className="card-title">Year 1 cumulative</div>
                <div className="card-value amount">{fmt(totalY1)}</div>
                <div className="card-note">Flat earnings, network ramping</div>
              </div>
              <div className="card gold">
                <div className="card-title">Year 2 cumulative</div>
                <div className="card-value amount" style={{ color: 'var(--crimson-dark)' }}>{fmt(totalY2)}</div>
                <div className="card-note">Compounding kicks in</div>
              </div>
              <div className="card" style={{ background: 'var(--navy-dark)', color: 'var(--white)', borderLeftColor: 'var(--gold)' }}>
                <div className="card-title" style={{ color: 'var(--gold)' }}>2-year total</div>
                <div style={{ fontSize: '28px', fontWeight: 800, color: 'var(--gold)' }} className="amount">{fmt(totalY1 + totalY2)}</div>
                <div className="card-note" style={{ color: 'rgba(255,255,255,0.6)' }}>{Math.round((totalY2 / totalY1 - 1) * 100)}% jump in Year 2</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── SLIDE 11: CLOSE ─────────────────────────────────────────────────────────
    function CloseSlide({ slideNum, total }) {
      return (
        <div className="slide close-slide">
          <SlideHeader title="Why start building now" subtitle="Next step" slideNum={slideNum} total={total} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', textAlign: 'center', color: 'var(--white)' }}>
            <h2 style={{ fontSize: '42px', fontWeight: 800, marginBottom: '24px', color: 'var(--gold)', letterSpacing: '-1px' }}>Build your 4-level chain while spots are open</h2>
            <p style={{ fontSize: '18px', maxWidth: '700px', marginBottom: '40px', lineHeight: 1.6, color: 'rgba(255,255,255,0.9)' }}>The earlier you start recruiting sub-IBs, the longer your network has to compound. Direct clients pay you for years — sub-IB chains pay you forever.</p>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '24px', maxWidth: '900px', marginBottom: '40px' }}>
              <div style={{ background: 'rgba(255,255,255,0.08)', padding: '20px', borderRadius: '8px', borderTop: '3px solid var(--gold)' }}>
                <div style={{ fontSize: '36px', fontWeight: 800, color: 'var(--gold)', marginBottom: '4px' }}>1</div>
                <div style={{ fontSize: '14px', fontWeight: 600, marginBottom: '6px' }}>Get your sub-IB link from your upline</div>
                <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.7)' }}>Your unique referral link tracks every client and sub-IB you bring in</div>
              </div>
              <div style={{ background: 'rgba(255,255,255,0.08)', padding: '20px', borderRadius: '8px', borderTop: '3px solid var(--gold)' }}>
                <div style={{ fontSize: '36px', fontWeight: 800, color: 'var(--gold)', marginBottom: '4px' }}>2</div>
                <div style={{ fontSize: '14px', fontWeight: 600, marginBottom: '6px' }}>Onboard your first 5 clients</div>
                <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.7)' }}>Templates, scripts, and training materials provided to help you close</div>
              </div>
              <div style={{ background: 'rgba(255,255,255,0.08)', padding: '20px', borderRadius: '8px', borderTop: '3px solid var(--gold)' }}>
                <div style={{ fontSize: '36px', fontWeight: 800, color: 'var(--gold)', marginBottom: '4px' }}>3</div>
                <div style={{ fontSize: '14px', fontWeight: 600, marginBottom: '6px' }}>Scale into L2–L4 recruiting</div>
                <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.7)' }}>Activate your 4-level chain for compounding override income</div>
              </div>
            </div>
            <a href="https://beacons.ai/adzharmz" target="_blank" rel="noopener noreferrer"
              style={{ display: 'inline-block', padding: '16px 40px', background: 'var(--crimson)', color: 'var(--white)', borderRadius: '6px', fontSize: '18px', fontWeight: 700, border: '2px solid var(--gold)', textDecoration: 'none' }}>
              Let's get your sub-IB account set up
            </a>
            <p style={{ fontSize: '12px', color: 'rgba(255,255,255,0.5)', marginTop: '24px', letterSpacing: '1px' }}>Adzhar · BD Manager · VT Markets Malaysia</p>
          </div>
        </div>
      );
    }

    // ── APP ──────────────────────────────────────────────────────────────────────
    function App() {
      const [slide, setSlide] = useState(0);
      const totalSlides = 11;

      useEffect(() => {
        const handler = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
            e.preventDefault();
            setSlide(s => Math.min(s + 1, totalSlides - 1));
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            setSlide(s => Math.max(s - 1, 0));
          } else if (e.key === 'Home') {
            setSlide(0);
          } else if (e.key === 'End') {
            setSlide(totalSlides - 1);
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, []);

      const slides = [
        <TitleSlide />,
        <PositionSlide slideNum={2} total={totalSlides} />,
        <ChainSlide slideNum={3} total={totalSlides} />,
        <TiersSlide slideNum={4} total={totalSlides} />,
        <FullDistributionSlide slideNum={5} total={totalSlides} />,
        <LimitedDistributionSlide slideNum={6} total={totalSlides} />,
        <G1Slide slideNum={7} total={totalSlides} />,
        <CalculatorSlide slideNum={8} total={totalSlides} />,
        <ScenariosSlide slideNum={9} total={totalSlides} />,
        <GrowthChartSlide slideNum={10} total={totalSlides} />,
        <CloseSlide slideNum={11} total={totalSlides} />,
      ];

      return (
        <div className="slide-container">
          {slides[slide]}
          <div className="nav-bar">
            <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
              <span className="brand">VT MARKETS</span>
              <span className="brand-sub">Sub-IB Partnership Deck · L1 View</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
              <button className="nav-btn" onClick={() => setSlide(s => Math.max(s - 1, 0))} disabled={slide === 0}>← Prev</button>
              <div className="progress-dots">
                {Array.from({ length: totalSlides }, (_, i) => (
                  <div key={i} className={'dot' + (i === slide ? ' active' : '')} onClick={() => setSlide(i)}></div>
                ))}
              </div>
              <span style={{ fontSize: '12px', color: 'rgba(255,255,255,0.7)', minWidth: '45px', textAlign: 'center' }}>{slide + 1} / {totalSlides}</span>
              <button className="nav-btn primary" onClick={() => setSlide(s => Math.min(s + 1, totalSlides - 1))} disabled={slide === totalSlides - 1}>Next →</button>
              <button className="btn-print" onClick={() => window.print()}>Print</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
