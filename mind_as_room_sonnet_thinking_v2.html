
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #app { padding: 1.5rem 0; font-family: var(--font-sans, system-ui); }
  .generate-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--color-text-primary); color: var(--color-background-primary);
    border: none; border-radius: var(--border-radius-md); padding: 10px 22px;
    font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 1.5rem;
    transition: opacity 0.2s;
  }
  .generate-btn:hover { opacity: 0.82; }
  .generate-btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .status-msg { font-size: 13px; color: var(--color-text-secondary); min-height: 20px; margin-bottom: 1rem; }
  .thinking-box {
    background: var(--color-background-secondary);
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1rem 1.2rem; margin-bottom: 1.2rem; display: none;
  }
  .thinking-box.visible { display: block; }
  .thinking-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 6px;
  }
  .thinking-text {
    font-size: 12px; color: var(--color-text-secondary); line-height: 1.65;
    max-height: 200px; overflow-y: auto; white-space: pre-wrap;
    font-family: var(--font-mono, monospace);
  }
  .room-wrap { display: none; }
  .room-wrap.visible { display: block; }
  .room-header {
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.4rem 1.5rem; margin-bottom: 1rem;
    background: var(--color-background-primary);
  }
  .room-name { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
  .room-vibe { font-size: 14px; color: var(--color-text-secondary); line-height: 1.7; margin-bottom: 10px; }
  .room-signature {
    font-size: 13px; color: var(--color-text-secondary); line-height: 1.6;
    border-left: 2px solid var(--color-border-secondary);
    padding-left: 12px; margin-top: 8px;
  }
  .zones-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; margin-bottom: 1rem;
  }
  .zone-card {
    background: var(--color-background-secondary);
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md); padding: 1rem;
  }
  .zone-emoji { font-size: 24px; display: block; margin-bottom: 8px; }
  .zone-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .zone-desc { font-size: 12px; color: var(--color-text-secondary); line-height: 1.55; }
  .insight-box {
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.2rem 1.4rem; background: var(--color-background-primary);
  }
  .insight-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 6px; }
  .insight-text { font-size: 13px; color: var(--color-text-secondary); line-height: 1.7; font-style: italic; }
  .error-box {
    background: var(--color-background-secondary);
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    padding: 0.9rem 1rem; font-size: 13px;
    color: var(--color-text-primary); display: none;
  }
  .error-box.visible { display: block; }
  .spin {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--color-border-secondary);
    border-top-color: var(--color-background-primary);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 520px) { .zones-grid { grid-template-columns: 1fr 1fr; } }
</style>

<div id="app">
  <h2 class="sr-only">Adzhar's mind as a room — powered by Claude Sonnet extended thinking</h2>

  <button class="generate-btn" id="genBtn" onclick="generate()">
    <span id="btnIcon">✦</span> Generate with Sonnet extended thinking
  </button>

  <div class="status-msg" id="status"></div>
  <div class="error-box" id="errBox"></div>

  <div class="thinking-box" id="thinkingBox">
    <div class="thinking-label">Sonnet's thinking</div>
    <div class="thinking-text" id="thinkingText"></div>
  </div>

  <div class="room-wrap" id="roomWrap">
    <div class="room-header">
      <div class="room-name" id="roomName"></div>
      <div class="room-vibe" id="roomVibe"></div>
      <div class="room-signature" id="roomSig"></div>
    </div>
    <div class="zones-grid" id="zonesGrid"></div>
    <div class="insight-box">
      <div class="insight-label">Hidden insight</div>
      <div class="insight-text" id="roomInsight"></div>
    </div>
  </div>
</div>

<script>
const PROFILE = `You are introspecting deeply about a real person named Adzhar. Here is a comprehensive profile:

IDENTITY & LOCATION: Malaysian man based in Shah Alam, Selangor. Communicates naturally in Bahasa Malaysia and Manglish (code-switching English/BM). Married to a Syariah lawyer. Has a Maine Coon mix cat named Lucy.

CAREER: Business Development Manager (BDM) at VT Markets, a forex broker. Manages 230+ Introducing Broker (IB) partnerships. Daily work spans IB recruitment, client activation, retention, marketing content, and reporting. Key people: Firdaus (team lead who owns the "BraderPip" brand Adzhar used to use), Callum (senior manager), Shaz (senior BDM). Currently expanding into Eurozone markets.

TECHNICAL DEPTH: Software Engineering degree. Builds MQL4/MQL5 Expert Advisors (trading robots) — CandlePatternScanner, HotkeyTrader. Writes Tampermonkey scripts for admin panel automation. Runs a local LLM stack: Ollama + qwen3:30b on desktop (RTX 3060 12GB). Builds in Python, JavaScript, HTML. Explored n8n, OpenWA.

CREATIVE WORK: Designs promotional materials — posters, pitch decks, email campaigns — in a navy and copper palette. Writes copywriting kits (Hari Raya, IB campaigns). Built full Notion "BDM Brain" database with 38+ structured cards. Uses frameworks like RTCRSO for AI prompting.

TRADING PERSONA: Active XAUUSD (gold) trader since 2016. In the forex/brokerage industry since 2019. Simultaneously builds trading tools AND sells brokerage services — he is both practitioner and merchant.

PERSONAL PASSIONS: Yamaha MT-25 motorcycle (planning Level 2 performance upgrades). Anime and Japanese culture. Coordinated a 11-person Europe trip (London, Paris, Zurich, Interlaken, Lucerne) including halal logistics. Seeks a new personal brand after losing "BraderPip" to his team lead. Built personal website on Next.js/Tailwind/Vercel.

CONTRADICTIONS & DEPTH: He is a BDM who codes. A trader who builds the systems others trade on. A creative marketer who thinks in frameworks. A community leader (coordinating group trips, managing 230+ IBs) who runs a private local LLM setup at home. He constantly oscillates between being the person in front of the camera and the person behind the systems.

---

YOUR TASK: Imagine Adzhar's mind as a physical room. Think deeply — beyond the obvious. Consider:
- What is the overall sensory feel of this room? Temperature, light, smell, sound?
- What are exactly 6 zones that reveal different facets of who he is?
- What is the ONE architectural feature of this room that could belong to NO ONE ELSE?
- What does the room hide that contradicts the surface?

Respond ONLY with valid JSON, no markdown fences, no preamble, no explanation outside the JSON:
{
  "roomName": "evocative short name for the room",
  "vibe": "2-3 sentences on the sensory feel — light, temperature, sound, smell, energy",
  "signature": "1-2 sentences on the single architectural feature that is uniquely his",
  "zones": [
    { "emoji": "one emoji", "name": "zone name (3-5 words)", "desc": "2-3 sentences revealing something true and specific about this zone" },
    { "emoji": "one emoji", "name": "...", "desc": "..." },
    { "emoji": "one emoji", "name": "...", "desc": "..." },
    { "emoji": "one emoji", "name": "...", "desc": "..." },
    { "emoji": "one emoji", "name": "...", "desc": "..." },
    { "emoji": "one emoji", "name": "...", "desc": "..." }
  ],
  "insight": "2-3 sentences on what this room reveals about Adzhar's hidden contradictions or unexpected depth — be honest and surprising, not flattering"
}`;

async function generate() {
  const btn = document.getElementById('genBtn');
  const status = document.getElementById('status');
  const thinkingBox = document.getElementById('thinkingBox');
  const thinkingText = document.getElementById('thinkingText');
  const roomWrap = document.getElementById('roomWrap');
  const errBox = document.getElementById('errBox');
  const icon = document.getElementById('btnIcon');

  btn.disabled = true;
  icon.innerHTML = '<span class="spin"></span>';
  errBox.classList.remove('visible');
  roomWrap.classList.remove('visible');
  thinkingBox.classList.remove('visible');
  status.textContent = 'Sending to Claude Sonnet with extended thinking (budget: 8000 tokens)…';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 10000,
        thinking: { type: 'enabled', budget_tokens: 8000 },
        messages: [{ role: 'user', content: PROFILE }]
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();

    const thinkBlock = data.content.find(b => b.type === 'thinking');
    if (thinkBlock?.thinking) {
      thinkingText.textContent = thinkBlock.thinking;
      thinkingBox.classList.add('visible');
    }

    const textBlock = data.content.find(b => b.type === 'text');
    if (!textBlock?.text) throw new Error('No text block in response');

    let raw = textBlock.text.trim()
      .replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```$/i, '').trim();

    const parsed = JSON.parse(raw);

    document.getElementById('roomName').textContent = parsed.roomName || '';
    document.getElementById('roomVibe').textContent = parsed.vibe || '';
    document.getElementById('roomSig').textContent = parsed.signature || '';

    const grid = document.getElementById('zonesGrid');
    grid.innerHTML = '';
    (parsed.zones || []).slice(0, 6).forEach(z => {
      const el = document.createElement('div');
      el.className = 'zone-card';
      el.innerHTML = `<span class="zone-emoji">${z.emoji || '🔲'}</span><div class="zone-name">${z.name || ''}</div><div class="zone-desc">${z.desc || ''}</div>`;
      grid.appendChild(el);
    });

    document.getElementById('roomInsight').textContent = parsed.insight || '';
    roomWrap.classList.add('visible');

    const i = data.usage;
    status.textContent = i ? `Done — ${i.input_tokens} input · ${i.output_tokens} output · ${(i.cache_read_input_tokens||0)} cached tokens` : 'Done.';

  } catch (e) {
    errBox.textContent = 'Error: ' + e.message;
    errBox.classList.add('visible');
    status.textContent = '';
  }

  btn.disabled = false;
  icon.textContent = '✦';
}
</script>
