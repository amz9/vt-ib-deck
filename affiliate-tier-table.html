<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IB Affiliate Tier Table</title>
  <style>
    /* ── CSS Variables – edit here to retheme ── */
    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface-alt:  #1c2230;
      --border:       #30363d;
      --accent:       #d4a017;
      --accent-glow:  rgba(212,160,23,.18);
      --silver:       #a8b2c0;
      --gold:         #d4a017;
      --platinum:     #7ecfcf;
      --super:        #c084fc;
      --vip:          #f97316;
      --text:         #e6edf3;
      --text-muted:   #8b949e;
      --text-dim:     #6e7681;
      --radius:       10px;
      --shadow:       0 4px 24px rgba(0,0,0,.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 32px 16px 64px;
    }

    /* ── Page header ── */
    .page-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .page-header .eyebrow {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .page-header h1 {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .page-header .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ── Wrapper ── */
    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    /* ── Table ── */
    table {
      width: 100%;
      min-width: 900px;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
    }

    th, td {
      padding: 0;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    th:last-child, td:last-child { border-right: none; }

    /* ── thead row 1 – category label + tier blocks ── */
    .th-category-label {
      background: var(--surface-alt);
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: center;
      padding: 10px 8px;
      vertical-align: middle;
    }

    .th-tier {
      text-align: center;
      padding: 14px 10px 10px;
      vertical-align: top;
    }
    .th-tier .tier-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 5px;
    }
    .th-tier .tier-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: .04em;
    }

    /* tier colour schemes */
    .tier-silver .tier-badge { background: rgba(168,178,192,.18); color: var(--silver); border: 1px solid var(--silver); }
    .tier-gold   .tier-badge { background: rgba(212,160,23,.18);  color: var(--gold);   border: 1px solid var(--gold); }
    .tier-platinum .tier-badge { background: rgba(126,207,207,.15); color: var(--platinum); border: 1px solid var(--platinum); }
    .tier-super  .tier-badge { background: rgba(192,132,252,.15); color: var(--super);  border: 1px solid var(--super); }
    .tier-vip    .tier-badge { background: rgba(249,115,22,.15);  color: var(--vip);    border: 1px solid var(--vip); }

    .tier-silver   { background: rgba(168,178,192,.06); }
    .tier-gold     { background: rgba(212,160,23,.06); }
    .tier-platinum { background: rgba(126,207,207,.06); }
    .tier-super    { background: rgba(192,132,252,.06); }
    .tier-vip      { background: rgba(249,115,22,.06); }

    /* ── thead row 2 – column sub-headers ── */
    .th-col-label {
      background: var(--surface-alt);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      padding: 8px 10px;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    /* ── tbody ── */
    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover td { background: rgba(255,255,255,.03); }

    .td-group {
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      background: var(--surface-alt);
      padding: 14px 10px;
      white-space: nowrap;
    }

    .td-spread {
      text-align: center;
      color: var(--text);
      padding: 14px 10px;
      font-size: 12.5px;
      white-space: nowrap;
    }

    .td-rebate {
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 10px;
    }
    .rebate-silver   { color: var(--silver); }
    .rebate-gold     { color: var(--gold); }
    .rebate-platinum { color: var(--platinum); }
    .rebate-super    { color: var(--super); }

    .td-vip {
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      min-width: 220px;
    }
    .td-vip .vip-highlight {
      display: block;
      color: var(--vip);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }

    /* alternating row tint */
    tbody tr:nth-child(even) td.td-spread,
    tbody tr:nth-child(even) td.td-rebate,
    tbody tr:nth-child(even) td.td-vip { background: rgba(255,255,255,.018); }

    /* ── Instrument header row (spanning) ── */
    .th-instrument {
      background: rgba(212,160,23,.1);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: center;
      padding: 7px 10px;
    }

    /* ── Note ── */
    .table-note {
      margin-top: 16px;
      padding: 12px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.7;
    }
    .table-note strong { color: var(--text-muted); }

    /* ── Legend strip ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: .04em;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════
     PAGE HEADER
════════════════════════════════════════════════ -->
<div class="page-header">
  <p class="eyebrow">Introducing Broker Programme</p>
  <h1 id="instrumentHeader"><!-- filled by JS --></h1>
  <p class="subtitle">Affiliate Tier Rebate Schedule · Monthly Performance &amp; Volume Based</p>
</div>

<!-- ════════════════════════════════════════════════
     TIER LEGEND
════════════════════════════════════════════════ -->
<div class="legend" id="legend"><!-- filled by JS --></div>

<!-- ════════════════════════════════════════════════
     TABLE
════════════════════════════════════════════════ -->
<div class="table-wrapper">
  <table id="tierTable"><!-- filled by JS --></table>
</div>

<!-- ════════════════════════════════════════════════
     NOTE
════════════════════════════════════════════════ -->
<p class="table-note" id="tableNote"><!-- filled by JS --></p>

<!-- ════════════════════════════════════════════════
     DATA & RENDER SCRIPT
     ─────────────────────────────────────────────
     Edit the CONFIG object below to customise all
     table content without touching HTML or CSS.
════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════
   CONFIG – edit this section to update table data
═══════════════════════════════════════════════ */
const CONFIG = {

  /* Page / section header */
  instrumentHeader: "FOREX, GOLD, OIL AND SILVER",

  /* ── Groups ────────────────────────────────── */
  groups: [
    { id: "G1", spreadFX: "0.2 pip + 6", spreadXAU: "1.2 pip + 6" },
    { id: "G2", spreadFX: "1.2 pip",     spreadXAU: "2.2 pip"     },
    { id: "G3", spreadFX: "1.7 pip",     spreadXAU: "2.8 pip"     },
    { id: "G4", spreadFX: "2.2 pip",     spreadXAU: "3.2 pip"     },
    { id: "G5", spreadFX: "3.2 pip",     spreadXAU: "4.2 pip"     },
  ],

  /* ── Tiers ──────────────────────────────────
     colorClass must match a CSS .tier-<x> rule.
     rebateByGroup: map of groupId -> rebate string.
  ─────────────────────────────────────────────── */
  tiers: [
    {
      tierName:   "SILVER TIER",
      colorClass: "tier-silver",
      rebateClass:"rebate-silver",
      headerSubText: "5K GROSS @ 5NDC @ 50LOT",
      rebateByGroup: {
        G1: "$1.00", G2: "$3.00", G3: "$4.00", G4: "$6.00", G5: "$11.00"
      }
    },
    {
      tierName:   "GOLD TIER",
      colorClass: "tier-gold",
      rebateClass:"rebate-gold",
      headerSubText: "10K GROSS @ 20NDC @ 200LOT",
      rebateByGroup: {
        G1: "$1.00", G2: "$5.00", G3: "$7.00", G4: "$10.00", G5: "$17.00"
      }
    },
    {
      tierName:   "PLATINUM TIER",
      colorClass: "tier-platinum",
      rebateClass:"rebate-platinum",
      headerSubText: "100K GROSS @ 150NDCC @ 1,200LOT",
      rebateByGroup: {
        G1: "$1.00", G2: "$7.00", G3: "$11.00", G4: "$16.00", G5: "$24.00"
      }
    },
    {
      tierName:   "SUPER TIER",
      colorClass: "tier-super",
      rebateClass:"rebate-super",
      headerSubText: "*NEED PERFORMANCE*",
      rebateByGroup: {
        G1: "$2.00", G2: "$8.00", G3: "$13.00", G4: "$18.00", G5: "$28.00"
      }
    },
  ],

  /* ── VIP Column ─────────────────────────────
     highestRebateTierName must match a tierName above.
     vipRequirementTextTemplate supports:
       {{tierName}}            → highestRebateTierName
       {{qualificationSummary}} → highestTierQualificationSummary
  ─────────────────────────────────────────────── */
  vipConfig: {
    highestRebateTierName: "SUPER TIER",
    highestTierQualificationSummary: "100K GROSS @ 150NDCC @ 1,200LOT + PERFORMANCE APPROVAL",
    vipRequirementTextTemplate:
      "To claim the highest rebate among all tiers ({{tierName}}), " +
      "IB must achieve {{qualificationSummary}} within the month. " +
      "Tier qualification is based on monthly performance and volume requirements.",
    /* Optional per-group overrides – set groupId key to a custom string
       or leave empty ({}) to use the template for all groups.           */
    perGroupOverride: {
      G1: "G1 IB must meet SUPER TIER conditions: achieve {{qualificationSummary}} monthly. " +
          "Note: G1 highest rebate is capped at $2.00 ({{tierName}}). " +
          "Performance approval required."
    }
  },

  /* ── Note under table ───────────────────────── */
  noteText:
    "Note: Tier qualification is based on monthly performance and volume requirements " +
    "as stated above. Rebate amounts shown are per standard lot (per side). " +
    "IB must fulfil all conditions within the same calendar month to qualify.",

};
/* ═══════════════════════════════════════════════
   END OF CONFIG
═══════════════════════════════════════════════ */


/* ── Helpers ────────────────────────────────── */
function resolveVipText(group, vipCfg) {
  const tpl =
    vipCfg.perGroupOverride[group.id] ||
    vipCfg.vipRequirementTextTemplate;

  return tpl
    .replace(/\{\{tierName\}\}/g,            vipCfg.highestRebateTierName)
    .replace(/\{\{qualificationSummary\}\}/g, vipCfg.highestTierQualificationSummary);
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') node.className = v;
    else if (k === 'colspan') node.colSpan = v;
    else if (k === 'rowspan') node.rowSpan = v;
    else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (typeof child === 'string') node.insertAdjacentHTML('beforeend', child);
    else if (child) node.appendChild(child);
  }
  return node;
}

/* ── Build table ──────────────────────────────── */
function buildTable() {
  const { groups, tiers, vipConfig } = CONFIG;

  const table = document.getElementById('tierTable');
  const thead = table.createTHead();
  const tbody = table.createTBody();

  /* ────────── THEAD ROW 1 – tier block headers ── */
  const tr1 = thead.insertRow();

  // Left fixed columns label
  const thLeft = el('th', { class: 'th-category-label', colspan: 3, rowspan: 1 },
    `<span>Group &amp; Spread Details</span>`
  );
  tr1.appendChild(thLeft);

  // One th per tier
  tiers.forEach(tier => {
    const th = el('th', { class: `th-tier ${tier.colorClass}` },
      `<div class="tier-badge">${tier.tierName}</div>` +
      `<div class="tier-sub">${tier.headerSubText}</div>`
    );
    tr1.appendChild(th);
  });

  // VIP column header
  const thVip = el('th', { class: 'th-tier tier-vip' },
    `<div class="tier-badge">VIP</div>` +
    `<div class="tier-sub">Highest Rebate Claim</div>`
  );
  tr1.appendChild(thVip);

  /* ────────── THEAD ROW 2 – instrument row (spanning) ── */
  const tr1b = thead.insertRow();
  const thInstrument = el('th', {
    class: 'th-instrument',
    colspan: 3 + tiers.length + 1
  }, CONFIG.instrumentHeader);
  tr1b.appendChild(thInstrument);

  /* ────────── THEAD ROW 3 – column labels ── */
  const tr2 = thead.insertRow();
  ['GROUP', 'SPREAD FX', 'SPREAD XAU'].forEach(label => {
    tr2.appendChild(el('th', { class: 'th-col-label' }, label));
  });
  tiers.forEach(tier => {
    tr2.appendChild(el('th', { class: 'th-col-label' }, 'REBATE / LOT'));
  });
  tr2.appendChild(el('th', { class: 'th-col-label' }, 'REQUIREMENTS'));

  /* ────────── TBODY ── */
  groups.forEach(group => {
    const vipText = resolveVipText(group, vipConfig);
    const tr = tbody.insertRow();

    // Group ID
    tr.appendChild(el('td', { class: 'td-group' }, group.id));

    // Spread columns
    tr.appendChild(el('td', { class: 'td-spread' }, group.spreadFX));
    tr.appendChild(el('td', { class: 'td-spread' }, group.spreadXAU));

    // Tier rebate columns
    tiers.forEach(tier => {
      const rebate = tier.rebateByGroup[group.id] || '–';
      tr.appendChild(el('td', { class: `td-rebate ${tier.rebateClass}` }, rebate));
    });

    // VIP column
    tr.appendChild(el('td', { class: 'td-vip' },
      `<span class="vip-highlight">★ ${vipConfig.highestRebateTierName}</span>` +
      vipText
    ));
  });
}

/* ── Build legend ──────────────────────────────── */
function buildLegend() {
  const legendEl = document.getElementById('legend');
  const tierColors = {
    'tier-silver':   getComputedStyle(document.documentElement).getPropertyValue('--silver').trim(),
    'tier-gold':     getComputedStyle(document.documentElement).getPropertyValue('--gold').trim(),
    'tier-platinum': getComputedStyle(document.documentElement).getPropertyValue('--platinum').trim(),
    'tier-super':    getComputedStyle(document.documentElement).getPropertyValue('--super').trim(),
  };

  CONFIG.tiers.forEach(tier => {
    const color = tierColors[tier.colorClass] || '#fff';
    legendEl.appendChild(el('div', { class: 'legend-item' },
      `<span class="legend-dot" style="background:${color}"></span>` +
      `<span>${tier.tierName}</span>`
    ));
  });
  // VIP
  const vipColor = getComputedStyle(document.documentElement).getPropertyValue('--vip').trim();
  legendEl.appendChild(el('div', { class: 'legend-item' },
    `<span class="legend-dot" style="background:${vipColor}"></span>` +
    `<span>VIP – HIGHEST REBATE</span>`
  ));
}

/* ── Inject static text ────────────────────────── */
document.getElementById('instrumentHeader').textContent = CONFIG.instrumentHeader;
document.getElementById('tableNote').innerHTML =
  `<strong>ℹ</strong> ${CONFIG.noteText}`;

buildLegend();
buildTable();
</script>
</body>
</html>
